<!DOCTYPE html>
<html>
<head>
    <title>Create New Password | Save Life</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f5;
            text-align: center;
            padding: 60px 20px;
        }
        .container {
            background: white;
            max-width: 420px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #c62828; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background: #c62828;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }
        .errorlist { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create New Password</h2>

        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change Password</button>
            </form>
        {% else %}
            <p>This password reset link is invalid or has expired.</p>
            <a href="{% url 'password_reset' %}">Request a New Link</a>
        {% endif %}
    </div>
</body>
</html>
