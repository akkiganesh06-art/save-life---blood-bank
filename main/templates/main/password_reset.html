
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Save Life</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff5f5;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #c62828;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 22px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a51f1f;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <h2>❤️ Save Life</h2>

        <h3 style="text-align:center;">Forgot Your Password?</h3>

        <p>
            Enter your registered email address.
            We will send you instructions to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="id_email">Registered Email Address</label>

            {{ form.email }}

            {% if form.email.errors %}
                <p style="color:red;">{{ form.email.errors }}</p>
            {% endif %}

            <button type="submit">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>

    </div>

</body>
</html>
